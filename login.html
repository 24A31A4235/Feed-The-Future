<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - Every bite counts</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e3f0ff 100%);
      min-height: 100vh;
    }
    .login-card {
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(44, 62, 80, 0.15);
      background: #fff;
      border: none;
    }
    .login-title {
      color: #007bff;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .btn-login, .btn-signup {
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 2rem;
      box-shadow: 0 2px 8px rgba(0,123,255,0.12);
      transition: background 0.2s;
      width: 48%;
      margin: 0 1%;
    }
    .btn-login {
      background: linear-gradient(90deg, #007bff 60%, #00c6ff 100%);
    }
    .btn-login:hover {
      background: linear-gradient(90deg, #0056b3 60%, #007bff 100%);
      color: #fff;
    }
    .btn-signup {
      background: linear-gradient(90deg, #28a745 60%, #00c6ff 100%);
    }
    .btn-signup:hover {
      background: linear-gradient(90deg, #218838 60%, #28a745 100%);
      color: #fff;
    }
    .signup-link {
      color: #007bff;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }
    .login-card label {
      color: #333;
      font-weight: 500;
    }
    .login-card input[type="text"], .login-card input[type="password"] {
      border-radius: 0.5rem;
      border: 1px solid #b3d1ff;
    }
    .login-card input:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 0.15rem rgba(0,123,255,.25);
    }
    .btn-group-login {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-md-6 col-lg-5">
        <div class="card login-card p-4">
          <h2 class="mb-4 text-center login-title">Login</h2>
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label">Username</label>
              <input type="text" class="form-control" id="login-email" required placeholder="Enter your username">
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label">Password</label>
              <input type="password" class="form-control" id="login-password" required placeholder="Enter your password">
            </div>
            <div class="btn-group-login">
              <button type="submit" class="btn btn-login">Login</button>
              <button type="button" class="btn btn-signup" id="signup-btn">Signup</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <span>If no account, <span class="signup-link" id="signup-link">Sign up</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Simple login logic: username "varun", password "password"
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (username === 'varun' && password === 'password') {
        // Show success message, then redirect after short delay
        const card = document.querySelector('.login-card');
        card.innerHTML = `
          <div class="text-center py-5">
            <h3 class="text-success mb-3">Login successful!</h3>
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="mt-3">Redirecting to homepage...</p>
          </div>
        `;
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 1500);
      } else {
        alert('Invalid credentials.');
      }
    });

    // Signup button and link (for demo, just shows alert)
    document.getElementById('signup-btn').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Signup functionality can be added here.');
    });
    document.getElementById('signup-link').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Signup functionality can be added here.');
    });
  </script>
</body>
</html>
